name: Headway REAL 17375873 $3.99 to $50 in 3HRS
on:
  workflow_dispatch:
jobs:
  trade:
    runs-on: windows-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MT5
        shell: powershell
        run: |
          pip install MetaTrader5==5.0.6180 numpy --quiet
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe -UseBasicParsing
          Start-Process -FilePath .\mt5setup.exe -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 35
      - name: Trade REAL
        shell: python
        env:
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          import subprocess, sys
          proc = subprocess.Popen([sys.executable, "bot.py"])
          try:
              proc.wait(timeout=10800)
          except:
              proc.terminate()
              print("3 HRS DONE")
